[server]
headless = true
port = 8501

[client]
showSidebarNavigation = false
# Oculta la toolbar de desarrollo y reduce el ruido en producción.
toolbarMode = "minimal"

[logger]
# Menos logging = menos overhead en cada rerun.
level = "error"

[theme]
primaryColor = "#1b6b35"
backgroundColor = "#f1f5f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#1e293b"
font = "sans serif"
